block.delve-collector.name = Collector
block.delve-collector.description = Spreads the core's inbuilt energy field across tiles, allowing it to produce more power every tile covered.\n\nCan act as a short ranged connection hub.\n\nUnobstructed by solid tiles.

block.delve-relay.name = Relay
block.delve-relay.description = Connects to buildings that can handle power.

block.delve-highway.name = Highway
block.delve-highway.description = Packages and transports items.

block.delve-blaster.name = Blaster
block.delve-blaster.description = Shoots out bursts of gathered particulate damaging anything caught in the way.

block.delve-grabber.name = Grabber
block.delve-grabber.description = Collects items on the ground infront of itself.

block.delve-warp-core.name = Warp Core
block.delve-warp-core.description = The main hub for any base.\n\nGenerates power based on how many tiles are covered by its energy field.\n\nLiquidates items into crystalline items, based on their attributes.
block.delve-warp-core.details = Also stores pigments made from the aether. How else do we colour our buildings..?

